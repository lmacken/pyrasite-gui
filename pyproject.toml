[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrasite-gui"
dynamic = ["version"]
description = "A graphical interface for interacting with running Python processes"
readme = "README.rst"
requires-python = ">=3.9"
authors = [
    {name = "Luke Macken", email = "lmacken@redhat.com"},
]
keywords = ["debugging", "injection", "runtime", "gtk"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyrasite>=2.1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
callgraph = ["pycallgraph2>=1.1"]

[project.urls]
Homepage = "https://github.com/lmacken/pyrasite-gui"
Issues = "https://github.com/lmacken/pyrasite-gui/issues"

[project.scripts]
pyrasite-gui = "pyrasite_gui.gui:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "pyrasite_gui.__version__"}

[tool.setuptools.packages.find]
include = ["pyrasite_gui*"]

[tool.setuptools.package-data]
pyrasite_gui = ["js/*.js"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# The GUI still uses percent formatting for generated HTML and log messages.
ignore = ["UP031"]
